services:
  m3u-stream:
    build: .
    image: ${IMAGE:-m3u-stream:local}
    network_mode: host
    environment:
      M3U_URL: ${M3U_URL}
      TV_IP: ${TV_IP}
      WEB_PORT: ${WEB_PORT:-8080}
      RELAY_PORT: ${RELAY_PORT:-8888}
      HOST_IP: ${HOST_IP:-}
      RELAY_BASE_URL: ${RELAY_BASE_URL:-}
    restart: unless-stopped
