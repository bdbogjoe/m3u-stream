{% extends "base.html" %}
{% block content %}
<header>
  <h1>m3u-stream</h1>
  <div class="controls">
    <label>
      Group:
      <select id="group-filter">
        <option value="">All</option>
        {% for g in groups %}<option value="{{ g }}">{{ g }}</option>{% endfor %}
      </select>
    </label>
    <input id="search" type="search" placeholder="Search…">
    <button id="reload-btn" type="button">Reload M3U</button>
    <button id="stop-btn" type="button">Stop</button>
    <span id="status"></span>
  </div>
  <div id="now-playing" {% if not current_id %}hidden{% endif %}>
    Now playing: <strong id="now-playing-name"></strong>
  </div>
</header>

<main>
  <div id="grid">
    {% for c in channels %}
    <div class="tile{% if c.id == current_id %} current{% endif %}"
         data-id="{{ c.id }}"
         data-name="{{ c.name|lower }}"
         data-group="{{ c.group }}">
      <div class="logo">
        {% if c.logo %}<img loading="lazy" src="{{ c.logo }}" alt="">{% endif %}
      </div>
      <div class="meta">
        <div class="name">{{ c.name }}</div>
        <div class="group">{{ c.group }}</div>
      </div>
      <button class="cast-btn" type="button" data-id="{{ c.id }}">Cast</button>
    </div>
    {% endfor %}
  </div>
</main>
{% endblock %}
